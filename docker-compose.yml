services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Solo el backend recibe credenciales; .env es opcional.
    env_file:
      - path: .env
        required: false
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # Valor fijo: un .env local no puede romper la conexión entre contenedores.
      BACKEND_URL: http://backend:8000
      APP_TITLE: ${APP_TITLE:-}
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    depends_on:
      - backend
