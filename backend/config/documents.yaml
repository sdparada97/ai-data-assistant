# Configuración de la ingesta y la recuperación de documentos (change add-document-retrieval).
# Fuente de los valores: docs/EXPLORACION_DATOS.md (estructura verificada de los documentos de data/raw/).

# Extensiones que se cargan (sin distinguir mayúsculas).
extensions: [".pdf", ".docx", ".md"]

# IDs de evidencia citables. Patrones por prefijo: los códigos de punto de venta (p. ej. OC-T-001) no coinciden.
# El orden importa: el patrón más largo primero (INV-LIM antes que INV).
id_patterns:
  - 'REP-\d{2}'
  - 'INV-LIM(?:-\d{2})?'
  - 'INV-\d{2}'
  - 'ENT-[A-Z]{3}-\d{2}'
  - 'OC-[A-Z]{3}-\d{2}'
  - 'CAM-\d{3}'
# Un párrafo, elemento de lista o título que empieza por un ID seguido de uno de estos separadores abre un fragmento.
id_separators: ["|", ":"]

# Conversión de PDF a Markdown.
pdf:
  title_min_size: 16           # tamaño de letra mínimo del título (los PDF usan 17 pt)
  section_min_size: 11         # tamaño mínimo de un título de sección (los PDF usan ~11,2 pt)
  section_pattern: '^\d+\.\s+\S'
  page_label_pattern: '^Página \d+$'
  paragraph_gap_ratio: 0.8     # salto vertical, en alturas de línea, que separa dos párrafos
  min_row_height_pt: 5         # altura mínima de un rectángulo de fondo para ser fila de tabla
  row_stack_tolerance_pt: 1    # tolerancia para considerar dos rectángulos apilados y del mismo ancho
  column_tolerance_pt: 3       # tolerancia al asignar una línea a su columna

# Modelo de embeddings (fastembed). La huella SHA-256 es la de `file` dentro de la revisión descargada.
model:
  name: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  source: Qdrant/paraphrase-multilingual-MiniLM-L12-v2-onnx-Q
  file: model_optimized.onnx
  sha256: 634d0f66c29dc934c8fa72b8a4fe91dd4d420a22f1d82a241058d4316e659a99
  dimension: 384

# Texto que se embebe por fragmento.
embedding_template:
  with_section: "{title} — {section}: {text}"
  without_section: "{title}: {text}"

# Recuperación.
rrf_k: 60
default_top_k: 5
max_top_k: 20
max_query_chars: 500
