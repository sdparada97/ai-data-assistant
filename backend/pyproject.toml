[project]
name = "analyst-backend"
version = "0.1.0"
description = "API del asistente de análisis comercial"
requires-python = ">=3.14,<3.15"
dependencies = [
    "duckdb==1.5.6",
    "fastapi==0.156.4",
    "fastembed==0.9.0",
    "httpx==0.28.1",
    "langchain-core==1.6.13",
    "langchain-google-genai==4.4.2",
    "langgraph==1.2.16",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "pandera==0.34.1",
    "pydantic==2.14.1",
    "pymupdf==1.28.2",
    "python-docx==1.2.0",
    "pyyaml==6.0.3",
    "rank-bm25==0.2.2",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"
