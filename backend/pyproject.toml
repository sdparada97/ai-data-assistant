[project]
name = "analyst-backend"
version = "0.1.0"
description = "API del asistente de análisis comercial"
requires-python = ">=3.14,<3.15"
dependencies = [
    "duckdb==1.5.6",
    "fastapi==0.156.4",
    "pandas==3.0.6",
    "pandera==0.34.1",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"
