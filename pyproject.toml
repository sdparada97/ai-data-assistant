# Raíz virtual del workspace de uv (D4). No es un paquete instalable.
[tool.uv.workspace]
members = ["backend", "frontend"]

[tool.uv]
required-version = "==0.13.4"

[dependency-groups]
dev = [
    "httpx2==2.15.1",
    "pytest==9.1.1",
]
# Exploración de datos (ETAPA 4): uv run --group explore python backend/scripts/explore_data.py
explore = [
    "pandas==3.0.6",
    "pymupdf==1.28.2",
    "python-docx==1.2.0",
    "tabulate==0.10.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "frontend/tests", "tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = [
    "llm: prueba que llama a un LLM real; requiere red y credenciales (make test-llm)",
    "embeddings: prueba con el modelo de embeddings real, sin red; requiere make models (make test-embeddings)",
]
